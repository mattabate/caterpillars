[project]
name = "caterpillars"
version = "0.1.0"
description = "Find letters that read as two different phrases: a ten dad / at end ad"
authors = [{ name = "Matt Abate" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://mattabate.com/projects"
Repository = "https://github.com/mattabate/caterpillars"

[project.scripts]
caterpillars = "caterpillars.cli:main"

[tool.poetry]
packages = [{ include = "caterpillars" }]
include = ["caterpillars/words.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
